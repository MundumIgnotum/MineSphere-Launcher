<!doctype html>
<html lang="pt" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>MineSphere Launcher</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 128 128" role="img" aria-label="MineSphere">
            <defs>
              <linearGradient id="brand-logo-outline" x1="16" y1="12" x2="112" y2="118" gradientUnits="userSpaceOnUse">
                <stop stop-color="var(--accent)"/>
                <stop offset=".55" stop-color="var(--accent)"/>
                <stop offset="1" stop-color="var(--accent-2)"/>
              </linearGradient>
              <linearGradient id="brand-logo-top" x1="64" y1="10" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop stop-color="var(--accent)" stop-opacity=".38"/>
                <stop offset="1" stop-color="var(--accent)" stop-opacity=".12"/>
              </linearGradient>
              <linearGradient id="brand-logo-left" x1="16" y1="37" x2="64" y2="118" gradientUnits="userSpaceOnUse">
                <stop stop-color="var(--accent)" stop-opacity=".24"/>
                <stop offset="1" stop-color="var(--logo-base)" stop-opacity=".05"/>
              </linearGradient>
              <linearGradient id="brand-logo-right" x1="112" y1="37" x2="64" y2="118" gradientUnits="userSpaceOnUse">
                <stop stop-color="var(--accent-2)" stop-opacity=".3"/>
                <stop offset="1" stop-color="var(--logo-base)" stop-opacity=".05"/>
              </linearGradient>
              <radialGradient id="brand-logo-sphere" cx="0" cy="0" r="1" gradientTransform="translate(57 55) rotate(48) scale(30)" gradientUnits="userSpaceOnUse">
                <stop stop-color="var(--logo-shine)"/>
                <stop offset=".28" stop-color="var(--accent)"/>
                <stop offset=".7" stop-color="var(--accent)"/>
                <stop offset="1" stop-color="var(--accent-2)"/>
              </radialGradient>
              <filter id="brand-logo-glow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <g filter="url(#brand-logo-glow)">
              <path d="M64 8 113 36v56L64 120 15 92V36Z" fill="var(--logo-base)" stroke="url(#brand-logo-outline)" stroke-width="5" stroke-linejoin="round"/>
              <path d="M64 8 113 36 64 64 15 36Z" fill="url(#brand-logo-top)"/>
              <path d="M15 36 64 64v56L15 92Z" fill="url(#brand-logo-left)"/>
              <path d="M113 36 64 64v56l49-28Z" fill="url(#brand-logo-right)"/>
              <path d="M64 8v56M15 36l49 28 49-28" fill="none" stroke="url(#brand-logo-outline)" stroke-width="3" stroke-linejoin="round" opacity=".9"/>
            </g>
            <circle cx="64" cy="62" r="22" fill="url(#brand-logo-sphere)"/>
            <circle cx="57" cy="54" r="7" fill="var(--logo-shine)" opacity=".28"/>
            <ellipse cx="64" cy="62" rx="37" ry="14" fill="none" stroke="var(--accent)" stroke-width="3" opacity=".55" transform="rotate(-24 64 62)"/>
            <circle cx="96" cy="48" r="4" fill="var(--accent-2)"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>MineSphere</strong>
          <span>LAUNCHER</span>
        </div>
      </div>

      <div class="sidebar-label">Navegação</div>
      <nav class="nav" id="mainNav">
        <button class="nav-item" data-page="home" title="Início">
          <span class="nav-icon" data-icon="home"></span><span class="nav-text">Início</span>
        </button>
        <button class="nav-item" data-page="library" title="Biblioteca">
          <span class="nav-icon" data-icon="library"></span><span class="nav-text">Biblioteca</span>
        </button>
        <button class="nav-item" data-page="versions" title="Versões">
          <span class="nav-icon" data-icon="layers"></span><span class="nav-text">Versões</span>
        </button>
        <button class="nav-item" data-page="mods" title="Mods">
          <span class="nav-icon" data-icon="puzzle"></span><span class="nav-text">Mods</span>
        </button>
        <button class="nav-item" data-page="modpacks" title="Modpacks">
          <span class="nav-icon" data-icon="package"></span><span class="nav-text">Modpacks</span>
        </button>
        <button class="nav-item" data-page="resources" title="Recursos">
          <span class="nav-icon" data-icon="sparkles"></span><span class="nav-text">Recursos</span>
        </button>
        <button class="nav-item" data-page="accounts" title="Contas">
          <span class="nav-icon" data-icon="users"></span><span class="nav-text">Contas</span>
        </button>
        <button class="nav-item" data-page="settings" title="Definições">
          <span class="nav-icon" data-icon="settings"></span><span class="nav-text">Definições</span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>
      <div class="sidebar-tip">
        <span class="tip-icon" data-icon="shield"></span>
        <div><strong>Privado e local</strong><span>Os teus dados ficam neste PC.</span></div>
      </div>
      <button class="account-chip" id="accountChip" data-action="account-chip">
        <span class="account-avatar" id="accountAvatar">?</span>
        <span class="account-meta">
          <strong id="accountName">Sem conta</strong>
          <span id="accountType">Adicionar conta</span>
        </span>
        <span class="chevron" data-icon="chevron-right"></span>
      </button>
      <div class="sidebar-footer">
        <span>MineSphere v1.0.0</span>
        <span class="dot"></span>
        <span>Minecraft Java</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <h1 id="pageTitle">Início</h1>
          <p id="pageSubtitle">A tua central de Minecraft, num só lugar.</p>
        </div>
        <div class="topbar-actions">
          <label class="search top-search">
            <span data-icon="search"></span>
            <input id="globalSearch" type="search" placeholder="Pesquisar mods, versões, modpacks..." autocomplete="off">
            <kbd>↵</kbd>
          </label>
          <button class="icon-btn" id="themeToggle" data-action="theme-toggle" title="Alternar tema">
            <span data-icon="moon"></span>
          </button>
          <button class="icon-btn quick-play" id="quickPlay" data-action="quick-play" title="Jogar agora">
            <span data-icon="play"></span>
          </button>
          <button class="btn primary" data-action="new-instance">
            <span data-icon="plus"></span> Nova instalação
          </button>
        </div>
      </header>

      <section class="content" id="content">
        <div class="boot-screen">
          <div class="orbit-loader"><span></span><span></span><span></span></div>
          <p>A carregar o MineSphere...</p>
        </div>
      </section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <div id="activityDock" class="activity-dock"></div>

  <template id="spinner-template">
    <span class="spinner"></span>
  </template>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
