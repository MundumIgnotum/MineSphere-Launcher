name: Criar release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verificar sintaxe
        run: npm run check
      - name: Construir as edições
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\build-release.ps1
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MineSphere-Setup.exe
            dist/MineSphere-Portable.zip
            dist/MineSphere-Web.zip
            dist/MineSphere-Launcher.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
